name: weekly-cot-update

on:
  schedule:
    - cron: "30 0 * * 6"
    - cron: "30 0 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest COT and update feed
        run: python scripts/weekly_update.py
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
      - name: Commit and push if changed
        run: |
          git config user.name "cot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "weekly COT update ($(date -u +%Y-%m-%d))"
            git push
          fi
