name: weekly-cot-update

# 一時的に調査専用の内容に差し替え中（EUR/JPY等クロス円コード探索）。
# main側のこのファイルは無傷（cronはmainの内容を使うため影響なし）。
# 調査完了後、直ちに元の内容に戻す。

on:
  schedule:
    - cron: "30 0 * * 6"
    - cron: "30 0 * * 2"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DIAG - search official CFTC weekly files for cross-rate contracts
        run: python scripts/_diag_symbol_search.py
