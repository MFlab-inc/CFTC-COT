name: backfill-history

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "開始年（公式年次ZIPは1986年まで遡及可能）"
        required: true
        default: "2005"
      allow_partial:
        description: "一部の年のZIPが取得できなくても成功扱いにする（公式から恒久的に消えた年がある場合のみ true）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # スクリプトが異常終了した場合は、この次の commit ステップが実行されない。
      # 取得漏れのある中途半端なデータがリポジトリに入らないための設計。
      # 判定はログ末尾の === coverage === / === tff coverage === / === health === で行う。
      # 入力値は ${{ }} でシェルに直接埋め込まず env 経由で渡す
      # （workflow_dispatch の入力は任意の文字列を書けるため）
      - name: Rebuild history from official annual zips
        run: |
          EXTRA=""
          if [ "$ALLOW_PARTIAL" = "true" ]; then
            EXTRA="--allow-partial"
            echo "::warning title=allow_partial 有効::一部の年が取得できなくても成功扱いになります。"
          fi
          python scripts/backfill.py --start-year "$START_YEAR" $EXTRA
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
          START_YEAR: ${{ github.event.inputs.start_year }}
          ALLOW_PARTIAL: ${{ github.event.inputs.allow_partial }}
      - name: Commit and push
        run: |
          git config user.name "cot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "backfill COT history from $START_YEAR"
            git push
          fi
        env:
          START_YEAR: ${{ github.event.inputs.start_year }}
