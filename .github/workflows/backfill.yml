name: backfill-history

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "開始年（公式年次ZIPは1986年まで遡及可能）"
        required: true
        default: "2005"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild history from official annual zips
        run: python scripts/backfill.py --start-year "${{ github.event.inputs.start_year }}"
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
      - name: Commit and push
        run: |
          git config user.name "cot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "backfill COT history from ${{ github.event.inputs.start_year }}"
            git push
          fi
